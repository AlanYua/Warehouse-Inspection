# Coolify：請用此檔（勿用 include）— Coolify 會忽略 include 內服務 →「未選擇任何服務」
# 手動 VPS 仍可用：docker compose -f docker-compose.prod.yml up -d
#
# Build 失敗在 Next「Collecting build traces」、exit 255：多半是 RAM 不足或 compose 並行 build。
# 伺服器先加 2–4GB swap；或改跑：sh scripts/docker-compose-build.sh（先 worker 再 app）

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: warehouse_inspection
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse_inspection"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://warehouse:${DB_PASSWORD}@db:5432/warehouse_inspection
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      LOCK_TTL_MINUTES: ${LOCK_TTL_MINUTES:-30}
      ERP_API_URL: ${ERP_API_URL:-}
      ERP_DB_URL: ${ERP_DB_URL:-}

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      app:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://warehouse:${DB_PASSWORD}@db:5432/warehouse_inspection
      SYNC_CRON_EXPRESSION: ${SYNC_CRON_EXPRESSION:-0 * * * *}
      ERP_API_URL: ${ERP_API_URL:-}
      ERP_DB_URL: ${ERP_DB_URL:-}

volumes:
  pgdata:
